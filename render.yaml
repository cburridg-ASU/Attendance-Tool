services:
  - type: web
    name: attendance-tool-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-tool-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: attendance-tool-db
    plan: free
